name: Build installers

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb,rpm
            artifact: VidChapterBuddy-Linux-x64
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
            artifact: VidChapterBuddy-Windows-x64
          - name: macOS Universal (Intel and Apple Silicon)
            os: macos-latest
            target: universal-apple-darwin
            bundles: dmg
            artifact: VidChapterBuddy-macOS-Universal
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils file gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-libav
      - name: Set up Rust
        shell: bash
        run: |
          rustup update stable
          rustup default stable
          if [ "${{ matrix.target }}" = "universal-apple-darwin" ]; then
            rustup target add aarch64-apple-darwin x86_64-apple-darwin
          else
            rustup target add "${{ matrix.target }}"
          fi
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: './src-tauri -> target'
          shared-key: ${{ matrix.target }}
          cache-on-failure: true
      - name: Install frontend dependencies
        run: npm ci
      - name: Check frontend and library logic
        run: npm test
      - name: Build desktop installers
        run: npm run tauri build -- --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
      - name: Upload private build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 14
          path: |
            src-tauri/target/**/release/bundle/appimage/*.AppImage
            src-tauri/target/**/release/bundle/deb/*.deb
            src-tauri/target/**/release/bundle/rpm/*.rpm
            src-tauri/target/**/release/bundle/nsis/*-setup.exe
            src-tauri/target/**/release/bundle/dmg/*.dmg
